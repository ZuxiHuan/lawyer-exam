<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>南京市律师执业面试考核题库 · 2024年版</title>
<meta name="author" content="兰台南京宦祖希律师">
<meta name="copyright" content="© 2024 兰台南京宦祖希律师 版权所有">
<meta name="description" content="南京市律师执业面试考核题库，2024年版，共100道题目，由兰台南京宦祖希律师整理制作。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --paper: #f5f0e8;
    --paper2: #ede8dc;
    --red: #c0392b;
    --red-light: #f9ede9;
    --gold: #b8860b;
    --gold-light: #f7f0d8;
    --border: #c8bfa8;
    --muted: #7a6f60;
    --success: #2d6a4f;
    --success-bg: #e8f4ef;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 2rem 2.5rem;
    position: relative;
    z-index: 1;
  }
  .header-inner .eyebrow {
    font-family: 'Noto Serif SC', 'SimSun', serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .header-inner h1 {
    font-family: 'Noto Serif SC', 'SimSun', serif;
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 0.75rem;
  }
  .header-inner .subtitle {
    font-size: 13px;
    color: #a09080;
    font-weight: 300;
  }
  .header-bg {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 40%;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 20px, rgba(255,255,255,0.015) 20px, rgba(255,255,255,0.015) 21px
    );
  }
  header::after {
    content: '';
    display: block;
    height: 3px;
    background: linear-gradient(90deg, var(--red) 0%, var(--gold) 100%);
  }

  /* ── NAV TABS ── */
  .nav-bar {
    background: var(--paper2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    padding: 0 2rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav-tab {
    padding: 0.85rem 1.4rem;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    background: none;
    border-top: none; border-left: none; border-right: none;
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    flex-shrink: 0;
  }
  .nav-tab:hover { color: var(--ink); }
  .nav-tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
  }
  .nav-spacer { flex: 1; min-width: 12px; }
  .progress-text {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── MAIN ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .stat-card {
    flex: 1;
    min-width: 100px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem 1.25rem;
  }
  .stat-card .s-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-card .s-val {
    font-family: 'Noto Serif SC', 'SimSun', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }
  .stat-card.accent .s-val { color: var(--red); }
  .stat-card.gold .s-val { color: var(--gold); }
  .stat-card.green .s-val { color: var(--success); }

  /* ── LOTTERY VIEW ── */
  .lottery-stage {
    text-align: center;
    padding: 3rem 1rem 2rem;
  }
  .lottery-ring {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: white;
    margin-bottom: 2rem;
    position: relative;
    transition: border-color 0.3s;
  }
  .lottery-ring.spinning {
    border-color: var(--red);
    animation: ring-pulse 0.5s ease-in-out infinite alternate;
  }
  .lottery-ring.landed {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px var(--gold-light);
  }
  @keyframes ring-pulse {
    from { box-shadow: 0 0 0 0 rgba(192,57,43,0.2); }
    to   { box-shadow: 0 0 0 12px rgba(192,57,43,0); }
  }
  .lottery-num {
    font-family: 'Noto Serif SC', 'SimSun', serif;
    font-size: 3.5rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    transition: color 0.3s;
  }
  .lottery-ring.landed .lottery-num { color: var(--gold); }
  .lottery-ring.spinning .lottery-num { color: var(--red); }

  .draw-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.9rem 2.5rem;
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
  }
  .draw-btn:hover:not(:disabled) { background: #2d2520; }
  .draw-btn:active:not(:disabled) { transform: scale(0.98); }
  .draw-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .draw-btn svg { width: 16px; height: 16px; }

  /* question card in lottery */
  .q-reveal {
    margin-top: 2.5rem;
    text-align: left;
    animation: slide-up 0.3s ease-out;
  }
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .q-card {
    background: white;
    border: 1px solid var(--border);
    border-top: 3px solid var(--red);
    border-radius: 0 0 6px 6px;
    padding: 1.75rem 2rem;
  }
  .q-meta {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }
  .q-body {
    font-family: 'Noto Serif SC', 'SimSun', serif;
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--ink);
    font-weight: 600;
  }
  .a-card {
    background: var(--success-bg);
    border: 1px solid #b7d5c7;
    border-radius: 6px;
    padding: 1.5rem 2rem;
    margin-top: 1rem;
    animation: slide-up 0.25s ease-out;
  }
  .a-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--success);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    font-weight: 500;
  }
  .a-body {
    font-size: 0.93rem;
    line-height: 2;
    color: #1a3a2a;
  }
  .card-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.25rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn-sec {
    padding: 0.6rem 1.4rem;
    background: white;
    border: 1px solid var(--border);
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-sec:hover { background: var(--paper2); }
  .btn-prim {
    padding: 0.6rem 1.4rem;
    background: var(--red);
    border: 1px solid var(--red);
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 13px;
    color: white;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-prim:hover { background: #a93226; }

  /* ── BROWSE VIEW ── */
  .search-bar {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    align-items: center;
  }
  .search-input {
    flex: 1;
    padding: 0.65rem 1rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: white;
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    min-width: 0;
  }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: #bbb; }
  .result-count {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .qa-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .qa-item { background: white; }
  .qa-q {
    padding: 1.1rem 1.25rem;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .qa-q:hover { background: #faf8f4; }
  .qa-q:active { background: var(--paper2); }
  .qa-num {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--paper2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    font-family: 'Noto Serif SC', serif;
    margin-top: 2px;
  }
  .qa-q-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    flex: 1;
  }
  .qa-chevron {
    flex-shrink: 0;
    margin-top: 4px;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .qa-item.open .qa-chevron { transform: rotate(180deg); }
  .qa-a {
    display: none;
    padding: 0 1.25rem 1.25rem 3.75rem;
    font-size: 13px;
    line-height: 2;
    color: #3a3028;
    background: #fdf9f4;
    border-top: 1px solid var(--paper2);
  }
  .qa-item.open .qa-a { display: block; }
  .highlight { background: #fff3a8; border-radius: 2px; }

  /* ── STATS VIEW ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .big-stat {
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.5rem;
    text-align: center;
  }
  .big-stat .bs-num {
    font-family: 'Noto Serif SC', 'SimSun', serif;
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 8px;
  }
  .big-stat .bs-label { font-size: 12px; color: var(--muted); }
  .bs-red { color: var(--red); }
  .bs-gold { color: var(--gold); }
  .bs-green { color: var(--success); }
  .bs-ink { color: var(--ink); }

  .history-section h3 {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--ink);
  }
  .history-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .h-chip {
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 12px;
    border: 1px solid var(--border);
    background: white;
    color: var(--muted);
    font-family: 'Noto Serif SC', serif;
  }
  .reset-btn {
    margin-top: 2rem;
    padding: 0.6rem 1.4rem;
    background: white;
    border: 1px solid var(--red);
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 13px;
    color: var(--red);
    cursor: pointer;
    border-radius: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .reset-btn:hover { background: var(--red-light); }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 14px;
    line-height: 2;
  }
  .empty-state .big { font-family: 'Noto Serif SC', serif; font-size: 2rem; margin-bottom: 0.5rem; color: var(--border); }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .header-inner { padding: 1.75rem 1rem 1.5rem; }
    .header-inner .eyebrow { letter-spacing: 3px; }

    .nav-inner { padding: 0 0.75rem; }
    .nav-tab { padding: 0.75rem 1rem; font-size: 13px; }

    main { padding: 1.25rem 0.875rem; }

    .stats-bar { gap: 0.625rem; margin-bottom: 1.5rem; }
    .stat-card { min-width: 0; padding: 0.875rem 1rem; }
    .stat-card .s-val { font-size: 1.5rem; }

    .lottery-stage { padding: 2rem 1rem 1.5rem; }
    .lottery-ring { width: 130px; height: 130px; }
    .lottery-num { font-size: 2.8rem; }
    .draw-btn { padding: 0.8rem 2rem; font-size: 14px; }

    .q-card { padding: 1.25rem 1rem; }
    .q-body { font-size: 0.97rem; }
    .a-card { padding: 1.25rem 1rem; }
    .a-body { font-size: 0.9rem; }
    .card-actions { gap: 0.5rem; }

    .qa-q { padding: 1rem; gap: 0.625rem; }
    .qa-q-text { font-size: 13.5px; }
    .qa-a { padding: 0 1rem 1rem 3.125rem; font-size: 13px; line-height: 1.9; }

    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .big-stat { padding: 1.25rem 1rem; }
    .big-stat .bs-num { font-size: 2.4rem; }
  }

  @media (max-width: 360px) {
    .nav-tab { padding: 0.7rem 0.75rem; font-size: 12px; }
    .stats-bar { flex-direction: column; }
    .q-body { font-size: 0.93rem; }
  }

  /* ── 版权角标水印 ── */
  .watermark-badge {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 999;
    background: rgba(26, 20, 16, 0.82);
    color: rgba(245, 240, 232, 0.92);
    font-family: 'Noto Serif SC', 'SimSun', serif;
    font-size: 11px;
    line-height: 1.6;
    padding: 0.55rem 0.85rem;
    border-radius: 4px;
    border-left: 2px solid var(--gold);
    backdrop-filter: blur(4px);
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    letter-spacing: 0.5px;
  }
  .watermark-badge .wm-name {
    color: var(--gold);
    font-weight: 600;
    display: block;
  }
  .watermark-badge .wm-copy {
    color: rgba(245, 240, 232, 0.6);
    font-size: 10px;
    display: block;
  }

  /* ── 底部版权栏 ── */
  footer.copyright-bar {
    background: var(--ink);
    color: rgba(245, 240, 232, 0.55);
    font-size: 12px;
    text-align: center;
    padding: 1.5rem 1rem;
    margin-top: 3rem;
    line-height: 2;
    border-top: 3px solid;
    border-image: linear-gradient(90deg, var(--red), var(--gold)) 1;
  }
  footer.copyright-bar strong {
    color: var(--gold);
    font-family: 'Noto Serif SC', 'SimSun', serif;
    font-weight: 600;
  }
  footer.copyright-bar .copy-divider {
    margin: 0 0.5rem;
    opacity: 0.3;
  }

  @media (max-width: 600px) {
    .watermark-badge { bottom: 0.875rem; right: 0.875rem; font-size: 10px; padding: 0.45rem 0.7rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-bg"></div>
  <div class="header-inner">
    <p class="eyebrow">南京市司法局 · 2024年版</p>
    <h1>律师执业面试考核题库</h1>
    <p class="subtitle">共 110 道题目 &nbsp;·&nbsp; 申请律师执业人员备考专用</p>
  </div>
</header>

<nav class="nav-bar">
  <div class="nav-inner">
    <button class="nav-tab active" onclick="switchView('lottery', this)">随机抽签</button>
    <button class="nav-tab" onclick="switchView('browse', this)">浏览全部</button>
    <button class="nav-tab" onclick="switchView('stats', this)">练习记录</button>
    <span class="nav-spacer"></span>
    <span class="progress-text" id="nav-progress">剩余 <strong>110</strong> 题</span>
  </div>
</nav>

<main>

  <!-- ── LOTTERY VIEW ── -->
  <div id="view-lottery" class="view active">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="s-label">总题数</div>
        <div class="s-val">110</div>
      </div>
      <div class="stat-card accent">
        <div class="s-label">剩余</div>
        <div class="s-val" id="s-remain">110</div>
      </div>
      <div class="stat-card gold">
        <div class="s-label">已抽</div>
        <div class="s-val" id="s-drawn">0</div>
      </div>
      <div class="stat-card green">
        <div class="s-label">当前题号</div>
        <div class="s-val" id="s-current">—</div>
      </div>
    </div>

    <div class="lottery-stage">
      <div class="lottery-ring" id="lottery-ring">
        <span class="lottery-num" id="lottery-num">?</span>
      </div>
      <br>
      <button class="draw-btn" id="draw-btn" onclick="drawQuestion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0 1 15.5-4.5M20 15a9 9 0 0 1-15.5 4.5"/></svg>
        点击抽签
      </button>
    </div>

    <div id="q-reveal" class="q-reveal" style="display:none">
      <div class="q-card">
        <div class="q-meta" id="q-meta">第 — 题</div>
        <div class="q-body" id="q-body"></div>
      </div>
      <div id="a-card" class="a-card" style="display:none">
        <div class="a-label">参考答案</div>
        <div class="a-body" id="a-body"></div>
      </div>
      <div class="card-actions">
        <button class="btn-sec" id="show-ans-btn" onclick="showAnswer()">查看答案</button>
        <button class="btn-prim" id="next-btn" style="display:none" onclick="nextQuestion()">下一题 →</button>
        <button class="btn-sec" onclick="resetPool()" style="margin-left:auto;color:var(--muted);font-size:12px">重置题库</button>
      </div>
    </div>
  </div>

  <!-- ── BROWSE VIEW ── -->
  <div id="view-browse" class="view">
    <div class="search-bar">
      <input class="search-input" id="search-input" placeholder="搜索题目关键词…" oninput="filterList()">
      <span class="result-count" id="result-count">共 110 题</span>
    </div>
    <div class="qa-list" id="qa-list"></div>
  </div>

  <!-- ── STATS VIEW ── -->
  <div id="view-stats" class="view">
    <div class="stats-grid">
      <div class="big-stat">
        <div class="bs-num bs-ink" id="bs-total">0</div>
        <div class="bs-label">累计抽签次数</div>
      </div>
      <div class="big-stat">
        <div class="bs-num bs-red" id="bs-remain">110</div>
        <div class="bs-label">未抽到题目</div>
      </div>
      <div class="big-stat">
        <div class="bs-num bs-gold" id="bs-drawn">0</div>
        <div class="bs-label">已练习题数</div>
      </div>
      <div class="big-stat">
        <div class="bs-num bs-green" id="bs-pct">0%</div>
        <div class="bs-label">覆盖率</div>
      </div>
    </div>

    <div class="history-section">
      <h3>已练习的题目</h3>
      <div class="history-chips" id="history-chips">
        <div class="empty-state"><div class="big">○</div>尚未开始练习</div>
      </div>
    </div>
    <button class="reset-btn" onclick="resetPool()">重置全部记录</button>
  </div>

</main>

<script>
const QA = [
  ["申请律师执业，应当具备哪些条件？","①拥护中华人民共和国宪法；②通过国家统一法律职业资格考试取得法律职业资格；③在律师事务所实习满一年；④品行良好。"],
  ["申请人有哪些情形不予颁发律师执业证书？","①无民事行为能力或者限制民事行为能力的；②受过刑事处罚的，但过失犯罪的除外；③被开除公职或者被吊销律师、公证员执业证书的。"],
  ["律师不得以哪些方式进行不正当竞争？","①不得以贬低同行的专业能力和水平等方式，招揽业务；②不得以提供或承诺提供回扣等方式承揽业务；③不得利用新闻媒介或其他手段向其提供虚假信息或夸大自己的专业能力；④不得在名片上印有各种学术、学历、非律师业职称、社会职务以及所获荣誉等；⑤不得以明显低于同业的收费水平竞争某项法律事务。"],
  ["律师可以从事哪些业务？","①接受自然人、法人或者其他组织的委托，担任法律顾问；②接受民事案件、行政案件当事人的委托，担任代理人，参加诉讼；③接受刑事案件犯罪嫌疑人、被告人的委托或依法接受法律援助机构的指派，担任辩护人；④接受委托，代理各类诉讼案件的申诉；⑤接受委托，参加调解、仲裁活动；⑥接受委托，提供非诉讼法律服务；⑦解答有关法律的询问、代写诉讼文书和有关法律事务的其他文书。"],
  ["受委托的律师如何取证？","律师自行调查取证的，凭律师执业证书和律师事务所证明，可以向有关单位或者个人调查与承办法律事务有关的情况。根据案情的需要，可以申请人民检察院、人民法院收集、调取证据或者申请人民法院通知证人出庭作证。"],
  ["律师应如何对待执业中获悉的秘密？","律师应当保守在执业活动中知悉的国家秘密、商业秘密，不得泄露当事人的隐私。对在执业活动中知悉的委托人和其他人不愿泄露的有关情况和信息，应当予以保密。但委托人或者其他人准备或者正在实施危害国家安全、公共安全以及严重危害他人人身安全的犯罪事实和信息除外。"],
  ["律师在执业中不得有哪些行为？","①私自接受委托、收取费用，接受委托人的财物或者其他利益；②利用提供法律服务的便利牟取当事人争议的权益；③接受对方当事人的财物或者其他利益，与对方当事人或者第三人恶意串通，侵害委托人的权益；④违反规定会见法官、检察官、仲裁员以及其他有关工作人员；⑤向法官、检察官、仲裁员等行贿或介绍贿赂；⑥故意提供虚假证据或威胁、利诱他人提供虚假证据；⑦煽动、教唆当事人采取扰乱公共秩序等非法手段解决争议；⑧扰乱法庭、仲裁庭秩序，干扰诉讼、仲裁活动的正常进行。"],
  ["律师协会应当履行哪些职责？","①保障律师依法执业，维护律师的合法权益；②总结、交流律师工作经验；③制定行业规范和惩戒规则；④组织律师业务培训和职业道德、执业纪律教育；⑤组织管理申请律师执业人员的实习活动；⑥对律师、律师事务所实施奖励和惩戒；⑦受理对律师的投诉或者举报，调解执业纠纷，受理律师的申诉；⑧法律、行政法规、规章以及律师协会章程规定的其他职责。"],
  ["律师协会对会员的违规行为实施纪律处分的种类有哪些？","①训诫；②警告；③通报批评；④公开谴责；⑤中止会员权利一个月以上一年以下；⑥取消会员资格。"],
  ["对律师的违规行为，有哪些情形可以从轻、减轻或免予处分？","①初次违规并且情节显著轻微或轻微的；②承认违规并作出诚恳书面反省的；③自觉改正不规范执业行为的；④及时采取有效措施，防止不良后果发生或减轻不良后果的。"],
  ["对律师的违规行为，有哪些情形应当从重处分？","①违规行为造成严重后果的；②逃避、抵制和阻挠调查的；③对投诉人、证人和有关人员打击报复的；④曾因违规行为受过行业处分或受过司法行政机关行政处罚的。"],
  ["律师不得实施哪些利益冲突行为？","①在同一案件中为双方当事人担任代理人；②近亲属是对方当事人的法定代表人或代理人的；③曾亲自处理过某案件的行政、司法人员成为律师后又办理该案件；④同所律师同时担任同一刑事案件被害人代理人和犯罪嫌疑人辩护人；⑤民事、行政诉讼中同所律师同时担任争议双方代理人；⑥非诉讼业务中同所律师同时担任彼此有利害关系各方代理人；⑦委托关系终止后同所或同一律师在同一案件后续中接受对方委托；⑧担任法律顾问期间为顾问单位的对方当事人代理；⑨前法官、检察官离任后二年内担任诉讼代理人或辩护人；⑩担任所在律师事务所其他律师任仲裁员的仲裁案件代理人；⑪其他依律师执业经验和行业常识能判断应主动回避的情形。"],
  ["律师不得实施哪些不尽责的行为？","①超越委托权限，从事代理活动的；②接受委托后无正当理由不提供约定法律服务、拒绝辩护或代理的；③无正当理由拒绝接受法律援助案件，或接受后拖延懈怠的；④因过错导致法律意见书存在重大遗漏或错误，给当事人造成重大损失的。"],
  ["律师不得利用提供法律服务的便利实施哪些行为？","①利用提供法律服务的便利牟取当事人利益；故意损害委托人利益的；②接受对方当事人的财物及其他利益，与对方当事人、第三人恶意串通，侵害委托人的权益；③为阻挠当事人解除委托关系，威胁、恐吓当事人或者扣留当事人提供的材料的。"],
  ["哪些行为属于违规收案、收费的情形？","①不按规定与委托人签订书面委托合同的；②不按规定统一接受委托、收取费用或保管财务票据的；③私自接受委托，私自收取费用，或收取规定外的费用；④执业期间以非律师身份从事有偿法律服务的；⑤不向委托人开具合法票据，或不提交办案费用开支有效凭证的；⑥在政府指导价领域违反规定收取费用，或违反风险代理管理规定收取费用。"],
  ["哪些属于不遵守法庭、仲裁庭纪律和监管场所规定的行为？","①会见在押犯罪嫌疑人、被告人时违规携带关系人会见，提供通讯工具，或传递物品、文件；②无正当理由拒不按人民法院通知出庭，或违反法庭规则擅自退庭；③聚众哄闹、冲击法庭，侮辱、诽谤、威胁、殴打司法工作人员或诉讼参与人，或有其他严重扰乱法庭秩序的行为。"],
  ["律师不得有哪些违反司法行政管理或者行业管理的行为？","①向司法行政机关或者律师协会提供虚假材料、隐瞒重要事实或者有其他弄虚作假行为的；②在受到停止执业处罚期间，或者在律师事务所被停业整顿、注销后继续执业的；③因违纪行为受到行业处分后在规定的期限内拒不改正的。"],
  ["律师执业应当受哪些监督？","律师执业应当接受司法行政机关、律师协会和社会公众的监督。"],
  ["律师职业道德基本准则有哪些？","①忠于宪法和法律，坚持以事实为根据，以法律为准绳，严格依法执业；②忠于职守，坚持原则，维护国家法律与社会正义；③诚实守信，勤勉尽责；④敬业勤业，努力钻研业务；⑤珍视和维护律师职业声誉，模范遵守社会公德；⑥严守国家机密，保守委托人的商业秘密及隐私；⑦尊重同行，同业互助，公平竞争；⑧自觉履行法律援助义务；⑨遵守律师协会章程，切实履行会员义务；⑩积极参加社会公益活动。"],
  ["律师在执业机构中有哪些纪律？","①律师的执业活动必须接受律师事务所的监督和管理；②不得同时在两个或两个以上律师事务所执业；③不得以个人名义私自接受委托，不得私自收取费用；④不得违反收费制度和财务纪律，挪用、私分、侵占业务收费；⑤律师因执业过错给律师事务所造成损失的，应当承担相应责任。"],
  ["委托人委托的事项属于法律禁止的范围，律师应当如何处理？","对委托人拟委托的事项或者要求属于法律或律师执业规范所禁止的，律师应告知委托人，并提出修改建议或予以拒绝。"],
  ["律师面对委托人不当要求时应坚持什么原则？","律师应当恪守独立履行职责的原则，不因迎合委托人或满足委托人的不当要求，丧失客观、公正的立场，不得协助委托人实施非法的或具有欺诈性的行为。"],
  ["律师应如何对待委托人提供的证据、法律文件及财物？","律师应当谨慎保管委托人提供的证据和其他法律文件，保证其不丢失或毁损。律师不得挪用或者侵占代委托人保管的财物。"],
  ["《中华人民共和国律师法》所称律师的定义是什么？","本法所称律师，是指依法取得律师执业证书，接受委托或者指定，为当事人提供法律服务的执业人员。"],
  ["律师担任法律顾问可以从事哪些业务？","按照约定为委托人就有关法律问题提供意见，草拟、审查法律文书，代理参加诉讼、调解或者仲裁活动，办理委托的其他法律事务，维护委托人的合法权益。"],
  ["律师担任辩护人的职责是什么？","律师担任辩护人的，应当根据事实和法律，提出犯罪嫌疑人、被告人无罪、罪轻或者减轻、免除其刑事责任的材料和意见，维护犯罪嫌疑人、被告人的诉讼权利和其他合法权益。"],
  ["律师接受委托后是否可以拒绝辩护或代理？","律师接受委托后，无正当理由的，不得拒绝辩护或者代理。但是，委托事项违法、委托人利用律师提供的服务从事违法活动或者委托人故意隐瞒与案件有关的重要事实的，律师有权拒绝辩护或者代理。"],
  ["律师出庭着装时，应遵守哪些规定？","①律师出庭服装仅用于法庭审理过程中，不得在其他时间、场合穿着；②应按规定配套穿着：内着浅色衬衣，佩带领巾，外着律师袍，并佩带律师徽章，下着深色西装裤、深色皮鞋；③保持服装洁净、平整，不整洁或有破损的不得使用；④应表现出严肃、庄重的精神风貌，律师出庭服装外不得穿着或佩带其他衣物或饰品。"],
  ["关于风险代理收费比例是如何规定的？","标的额不足100万元的部分不超过18%；100万元以上不足500万元的部分不超过15%；500万元以上不足1000万元的部分不超过12%；1000万元以上不足5000万元的部分不超过9%；5000万元以上的部分不超过6%。"],
  ["哪些法律事务或案件禁止风险代理？","刑事诉讼案件、行政诉讼案件、国家赔偿案件、群体性诉讼案件、婚姻继承案件，以及请求给予社会保险待遇、最低生活保障待遇、赡养费、抚养费、扶养费、抚恤金、救济金、工伤赔偿、劳动报酬的案件。"],
  ["律师业务推广主要包括哪些方式？","①发布律师个人广告、律师事务所广告；②建立、注册和使用网站、博客、微信公众号等互联网媒介；③印制和使用名片、宣传册等书面资料或视听资料；④出版书籍、发表文章；⑤举办、参加、资助会议、评比、评选活动；⑥其他可传达至社会公众的业务推广方式。"],
  ["律师、律师事务所具有哪些情形的，不得发布律师服务广告？","①未参加年度考核或者未通过年度考核的；②处于中止会员权利、停止执业或者停业整顿处罚期间，以及前述期间届满后未满一年的；③受到通报批评、公开谴责未满一年的；④其他不得发布广告的情形。"],
  ["律师、律师事务所进行业务推广时，不得有哪些行为？","①虚假、误导性或者夸大性宣传；②与登记注册信息不一致；③明示或暗示与司法机关、政府机关等有特殊关系；④贬低其他律师事务所或律师，或进行比较宣传；⑤承诺办案结果；⑥宣示胜诉率、赔偿额等可能产生不合理期望的信息；⑦明示或暗示提供回扣或其他利益；⑧不收费或减低收费（法律援助案件除外）；⑨未经客户许可发布客户信息；⑩与律师职业不相称的文字、图案、图片；⑪在非履行协会任职职责活动中使用协会任职职务；⑫使用中国、中华、全国等字样未经同意；⑬法律、法规规定的其他禁止性内容。"],
  ["禁止律师、律师事务所以哪些方式发布业务推广信息？","①采用艺术夸张手段制作、发布业务推广信息；②在公共场所粘贴、散发业务推广信息；③以电话、信函、短信、电子邮件等方式针对不特定主体进行业务推广；④在法院、检察院、看守所等场所附近以广告牌等形式发布业务推广信息；⑤其他有损律师职业形象的业务推广方式。"],
  ["律师业务推广应遵守哪些原则？","遵守平等、诚信原则，遵守律师职业道德和执业纪律，遵守律师行业公认的行业准则，公平竞争。"],
  ["律师个人广告的内容应当限制于哪些内容？","应当限于律师的姓名、肖像、年龄、性别，学历、学位、专业、律师执业许可日期、所任职律师事务所名称及执业期限；收费标准、联系方法；依法能够提供的法律服务业务范围；执业业绩。"],
  ["律师宣传不得有哪些内容？","①不得进行歪曲事实和法律，或可能使公众对律师产生不合理期望的宣传；②可以宣传所从事的某一专业领域，但不得声明或暗示被公认为某领域权威或专家；③不得进行律师之间或律师事务所之间的比较宣传。"],
  ["律师应与委托人就哪些内容进行协商并签署委托协议？","律师应当与委托人就委托事项范围、内容、权限、费用、期限等进行协商，经协商达成一致后，由律师事务所与委托人签署委托协议。"],
  ["哪些行为属于非法牟取委托人的权益？","①利用提供法律服务的便利，牟取当事人争议的权益；②违法与委托人就争议的权益产生经济上的联系，与委托人约定将争议标的物出售给自己；③委托他人为自己或近亲属收购、租赁委托人与他人发生争议的标的物。"],
  ["哪些情况下，律师及律师事务所不得与当事人建立或维持委托关系？","①律师在同一案件中为双方当事人担任代理人；②近亲属是对方当事人的法定代表人或代理人；③曾亲自处理过某案件的行政、司法人员成为律师后又办理该案件；④同所律师同时担任同一刑事案件被害人代理人和犯罪嫌疑人辩护人；⑤民事、行政诉讼中同所律师同时担任争议双方代理人；⑥非诉讼业务中同所律师同时担任彼此有利害关系各方代理人；⑦委托关系终止后同所或同一律师在同一案件后续中接受对方委托；⑧其他与前述7种情形相似的利益冲突情形。"],
  ["律师事务所和律师是否可以转委托？","未经委托人同意，律师事务所不得将委托的法律事务转委托其他律师事务所办理。但在紧急情况下，为维护委托人利益可以转委托，但应当及时告知委托人。受委托律师遇有突患疾病、工作调动等紧急情况时，应当及时报告律师事务所，由律师事务所另行指定律师继续承办，并及时告知委托人。非经委托人同意，不能因转委托而增加委托人的费用支出。"],
  ["有哪些情况，律师事务所应当终止委托关系？","①委托人提出终止委托协议的；②律师受到吊销执业证书或停止执业处罚，委托人不同意更换律师的；③当发现有利益冲突情形的；④受委托律师因健康状况不适合继续履行，委托人不同意更换律师的；⑤继续履行委托协议违反法律、法规、规章或者本规范的。"],
  ["有哪些情况，经提示委托人不纠正的，律师事务所可以解除委托协议？","①委托人利用律师提供的法律服务从事违法犯罪活动的；②委托人要求律师完成无法实现或者不合理的目标的；③委托人没有履行委托合同义务的；④在事先无法预见的前提下，律师提供法律服务将会带来不合理的费用负担或造成难以承受的困难的；⑤其他合法的理由的。"],
  ["律师在办案过程中应如何规范接触司法人员？","①遵守法庭、仲裁庭纪律，遵守出庭时间、举证时限、提交法律文书期限等；②在开庭审理过程中，应当尊重法庭、仲裁庭；③不得与所承办案件有关的司法、仲裁人员私下接触；④不得贿赂司法机关和仲裁机构人员；⑤不得介绍贿赂或者指使、诱导当事人行贿。"],
  ["律师应如何处理和其他律师的关系？","①律师与其他律师之间应当相互帮助、相互尊重；不得使用挖苦、讽刺或者侮辱性的语言；不得在公众场合及媒体上发表恶意贬低、诋毁、损害同行声誉的言论。②禁止不正当竞争，损害其他律师及律师事务所的声誉或者其他合法权益。"],
  ["依照有关规定取得从事特定范围法律服务的律师或律师事务所不得采取哪些不正当竞争的行为？","①限制委托人接受经过法定机构认可的其他律师或律师事务所提供法律服务；②强制委托人接受其提供的或者由其指定的律师提供的法律服务；③对抵制上述行为的委托人拒绝、中断、拖延、削减必要的法律服务或者滥收费用。"],
  ["律师或律师事务所相互之间不得采用哪些手段排挤竞争对手的公平竞争？","①串通抬高或者压低收费；②为争揽业务，不正当获取其他律师和律师事务所收费报价或者其他提供法律服务的条件；③泄露收费报价或者其他提供法律服务的条件等暂未公开的信息，损害相关律师事务所的合法权益。"],
  ["律师和律师事务所不得擅自或非法使用哪些名称以混淆误导委托人？","①有关政党、司法机关、行政机关、行业协会名称；②具有较高社会知名度的高等法学院校或者科研机构的名称；③为社会公众共知、具有较高知名度的非律师公众人物名称；④知名律师以及律师事务所名称。"],
  ["律师事务所对本所执业律师有哪些职责？","①负有教育、管理和监督的职责；②应当建立健全执业管理、利益冲突审查、收费与财务管理、投诉查处、年度考核、档案管理、劳动合同管理等制度；③应当依法保障律师及其他工作人员的合法权益；④统一接受委托，与委托人签订书面委托合同，统一收取费用；⑤应当定期组织律师开展时事政治、业务学习；⑥有义务对律师、实习人员在业务及职业道德等方面进行管理。"],
  ["律师与律师协会的关系有哪些规范？","①遵守律师协会制定的行业规范和规则，享有协会章程规定的权利，承担义务；②参加、完成律师协会组织的律师业务学习及考核；③参加国际性律师组织或以中国律师身份参加境外会议，应当报律师协会备案；④因执业行为成为刑、民事被告，或受到行政机关调查、处罚的，应当向律师协会书面报告；⑤积极参加律师协会组织的业务研究活动；⑥妥善处理律师执业中发生的纠纷，履行经律师协会调解达成的调解协议；⑦执行律师协会就律师执业纠纷作出的处理决定；⑧履行律师协会作出的处分决定；⑨按时缴纳会费。"],
  ["律师会见在押犯罪嫌疑人、被告人或者罪犯时，不得有哪些行为？","①传递违禁物品；②私自为被羁押人员传递书信、钱物或与案情有关的信息；③将通讯工具提供给被羁押人员使用；④未经监管部门和被羁押人员同意对会见进行录音、录像和拍照；⑤与被羁押人员的亲属或者其他人共同会见；⑥其他违反法律、法规、规章以及妨碍监管部门管理秩序的行为。"],
  ["律师应如何合法维护委托人合法利益？","①充分运用专业知识，尽心尽职地根据法律规定完成委托事项；②遵循诚实守信原则，客观告知委托人委托事项可能出现的法律风险；③有权根据法律的要求和道德标准，选择完成委托目的的方法；④严格按照法律规定的期限、时效以及约定的时间，及时办理委托事务；⑤及时告知委托人有关代理工作情况，对正当要求尽快答复；⑥恪守独立履行职责的原则，不得协助委托人实施非法或具有欺诈性的行为。"],
  ["律师应如何对待同行？","①遵守行业竞争规范，公平竞争，自觉维护执业秩序，维护律师行业的荣誉和社会形象；②尊重同行，相互学习，相互帮助，共同提高执业水平，不应诋毁、损害其他律师的威信和声誉。"],
  ["律师和律师事务所可以通过哪些方式介绍自己的业务领域和专业特长？","律师和律师事务所可以通过文字作品、研讨会、简介等方式以普及法律，宣传自己的专业领域，推荐自己的专业特长；提倡、鼓励律师、律师事务所参加社会公益活动。"],
  ["律师承办业务后，应告知委托人哪些内容？","①律师承办业务，应当告知委托人该委托事项办理可能出现的法律风险，不得用明示或者暗示方式对办理结果向委托人作出不当承诺。②律师承办业务，应当及时向委托人通报委托事项办理进展情况；需要变更委托事项、权限的，应当征得委托人的同意和授权。"],
  ["律师承办业务，应该如何引导当事人解决纠纷？","律师承办业务，应当引导当事人通过合法的途径、方式解决争议，不得采取煽动、教唆和组织当事人或者其他人员到司法机关或者其他国家机关静坐、举牌、打横幅、喊口号、声援、围观等扰乱公共秩序、危害公共安全的非法手段，聚众滋事，制造影响，向有关部门施加压力。"],
  ["律师不得以哪些不正当方式影响依法办理案件？","①未经当事人委托或法律援助机构指派，以律师名义为当事人提供法律服务、介入案件；②对本人或其他律师正在办理的案件进行歪曲、有误导性的宣传和评论，恶意炒作案件；③以串联组团、联署签名、发表公开信等方式制造舆论压力，攻击、诋毁司法机关和司法制度；④违反规定披露、散布不公开审理案件的信息、材料。"],
  ["律师对案件公开发表言论，应注意哪些方面？","律师对案件公开发表言论，应当依法、客观、公正、审慎，不得发表、散布否定宪法确立的根本政治制度、基本原则和危害国家安全的言论，不得利用网络、媒体挑动对党和政府的不满，不得发起、参与危害国家安全的活动，不得以歪曲事实真相等方式，发表恶意诽谤他人的言论，或者发表严重扰乱法庭秩序的言论。"],
  ["'以不正当手段承揽业务'的行为有哪些？","以诋毁其他律师事务所、律师，支付介绍费，向当事人明示或者暗示与办案机关、政府部门及其工作人员有特殊关系，或者在司法机关、监管场所周边违规设立办公场所、散发广告、举牌等不正当手段承揽业务。"],
  ["律师应保守在执业中获取的国家秘密和商业秘密，不得泄露他人隐私，哪些情况除外？","委托人或者其他人准备或者正在实施危害国家安全、公共安全以及严重危害他人人身安全的犯罪事实和信息除外。"],
  ["律师应如何对待法律援助的义务？","律师应当按照国家规定履行法律援助义务，为受援人提供符合标准的法律服务，维护受援人的合法权益，不得拖延、懈怠履行或者擅自停止履行法律援助职责，或者未经律师事务所、法律援助机构同意，擅自将法律援助案件转交其他人员办理。"],
  ["律师执业证书丢失后应如何处理？","律师应当妥善使用和保管律师执业证书，不得变造、抵押、出借、出租。如有遗失或者损毁的，应当及时报告所在地县级司法行政机关，经所在地设区的市级或者直辖市区（县）司法行政机关向原审核颁证机关申请补发或者换发。律师执业证书遗失的，应当在省级以上报刊或者发证机关指定网站上刊登遗失声明。"],
  ["设区的市级司法行政机关对律师、律师事务所有哪些监督管理职责？","①掌握本行政区域律师队伍建设和发展情况，制定加强律师队伍建设的措施和办法；②指导、监督下一级司法行政机关对律师执业的日常监督管理工作；③对律师进行表彰；④依法定职权对律师的违法行为实施行政处罚；⑤对律师事务所的律师执业年度考核结果实行备案监督；⑥受理、审查律师执业、变更执业机构、执业证书注销申请事项；⑦建立律师执业档案，负责有关律师执业许可、变更、注销等信息的公开工作；⑧法律、法规、规章规定的其他职责。"],
  ["律师事务所应当保障本所律师和辅助人员享有哪些权利？","①获得本所提供的必要工作条件和劳动保障；②获得劳动报酬及享受有关福利待遇；③向本所提出意见和建议；④法律、法规、规章及行业规范规定的其他权利。"],
  ["律师事务所应当监督本所律师和辅助人员履行哪些义务？","①遵守宪法和法律，遵守职业道德和执业纪律；②依法、诚信、规范执业；③接受本所监督管理，遵守本所章程和规章制度，维护本所的形象和声誉；④法律、法规、规章及行业规范规定的其他义务。"],
  ["律师事务所应当如何收费？","律师事务所应当按照有关规定统一收取服务费用并如实入账，建立健全收费管理制度，及时查处有关违规收费的举报和投诉，不得在实行政府指导价的业务领域违反规定标准收取费用，或者违反风险代理管理规定收取费用。"],
  ["对于律师违法执业或者因过错给当事人造成损失的，应如何赔偿？","律师违法执业或者因过错给当事人造成损失的，由其所在的律师事务所承担赔偿责任。律师事务所赔偿后，可以向有故意或者重大过失行为的律师追偿。"],
  ["司法行政机关对律师的违法行为可以给予哪些处罚？","司法行政机关对律师的违法行为可以给予警告、罚款、没收违法所得、停止执业、吊销执业证书五项处罚，其中前四项由律师执业机构所在地的设区的市级或者直辖市区（县）司法行政机关实施；吊销执业证书处罚的，由许可该律师执业的省、自治区、直辖市司法行政机关实施。"],
  ["律师受到停止执业处罚的，能否变更执业机构？担任合伙人有何限制？","律师受到停止执业处罚期限未满的，不得申请变更执业机构；受到六个月以上停止执业处罚的，执行处罚的期间以及期满未愈三年的，不得担任合伙人。"],
  ["民事诉讼中哪些情况下需要委托人的特别授权？","诉讼代理人代为承认、放弃、变更诉讼请求，进行和解，提起反诉或者上诉，必须有委托人的特别授权。"],
  ["律师办理刑事案件，在侦查阶段，辩护律师有哪些权利？","①可以为犯罪嫌疑人提供法律帮助，代理申诉、控告，申请变更强制措施，向侦查机关了解犯罪嫌疑人涉嫌的罪名和案件有关情况，提出意见；②可以同在押的犯罪嫌疑人、被告人会见和通信；③辩护律师会见犯罪嫌疑人、被告人时不被监听；④辩护律师经证人或者其他有关单位和个人同意，可以向他们收集与本案有关的材料。"],
  ["哪些属于不宜从事律师职业的不良品行？","①因故意犯罪受过刑事处罚的；②被开除公职的；③因违法违纪行为被国家机关、事业单位辞退的；④因违犯党纪受到撤销党内职务以上处分的；⑤被吊销律师、公证员执业证书的；⑥因违法违规行为被相关行业主管机关或者行业协会撤销其他职业资格或者吊销其他执业证书的；⑦因违反治安管理行为被处以行政拘留的；⑧因严重失信行为被纳入国家信用信息共享平台的；⑨有其他产生严重不良社会影响行为的。"],
  ["律师在受到警告处罚后一年内又发生应当给予警告处罚情形的如何处理？","由设区的市级或者直辖市的区人民政府司法行政部门给予停止执业三个月以上一年以下的处罚。"],
  ["南京市律师协会《律师函业务规范指引》对律师函送达规范是如何规定的？","律师函一般应由律师事务所直接送达或邮寄送达至受函对象。律师函不得采取张贴、公告、微信群、单位邮箱等公开方式送达。律师函不得交由委托人代为送达。"],
  ["南京市律师协会《律师函业务规范指引》对律师函的基本要求有哪些？","①律师函应当客观描述相关事实，准确传达委托人意思，审慎运用法律语言，依法表达法律意见；②不得使用侮辱、诽谤、恐吓、藐视等不当语言，不得进行贬低性评价或商业诋毁；③不得使用与律师事务所或律师职能不相符的表述，误使他人认为律师函具有强制法律效力。"],
  ["律师收费的原则及考虑的因素有哪些？","律师服务收费遵循公开公平、自愿有偿、诚实信用的原则。应当考虑：①耗费的工作时间；②法律事务的难易程度；③委托人的承受能力；④律师可能承担的风险和责任；⑤律师的社会信誉和工作水平等。"],
  ["律师收费的方式及适用的范围分别是什么？","律师服务收费可以采取计件收费、按标的额比例收费和计时收费等方式。①计件收费一般适用于不涉及财产关系的法律事务；②按标的额比例收费适用于涉及财产关系的法律事务；③计时收费可适用于全部法律事务。"],

// State
let pool = Array.from({length: 110}, (_, i) => i);
let drawn = [];
let currentIdx = null;
let spinning = false;

// ── Lottery logic ──
function drawQuestion() {
  if (pool.length === 0 || spinning) return;
  spinning = true;
  const btn = document.getElementById('draw-btn');
  const ring = document.getElementById('lottery-ring');
  const numEl = document.getElementById('lottery-num');
  btn.disabled = true;
  ring.className = 'lottery-ring spinning';

  document.getElementById('q-reveal').style.display = 'none';
  document.getElementById('a-card').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('show-ans-btn').style.display = '';

  let frame = 0;
  const total = 20;
  const iv = setInterval(() => {
    numEl.textContent = Math.floor(Math.random() * 110) + 1;
    frame++;
    if (frame >= total) {
      clearInterval(iv);
      const pos = Math.floor(Math.random() * pool.length);
      currentIdx = pool.splice(pos, 1)[0];
      drawn.push(currentIdx);

      ring.className = 'lottery-ring landed';
      numEl.textContent = currentIdx + 1;

      document.getElementById('q-meta').textContent = '第 ' + (currentIdx + 1) + ' 题 / 共 110 题';
      document.getElementById('q-body').textContent = QA[currentIdx][0];
      document.getElementById('a-body').textContent = QA[currentIdx][1];

      const reveal = document.getElementById('q-reveal');
      reveal.style.display = 'block';
      reveal.style.animation = 'none';
      void reveal.offsetWidth;
      reveal.style.animation = '';

      updateStats();
      btn.disabled = false;
      spinning = false;
    }
  }, 75);
}

function showAnswer() {
  document.getElementById('a-card').style.display = 'block';
  document.getElementById('show-ans-btn').style.display = 'none';
  if (pool.length > 0) document.getElementById('next-btn').style.display = '';
}

function nextQuestion() {
  document.getElementById('lottery-ring').className = 'lottery-ring';
  document.getElementById('lottery-num').textContent = '?';
  document.getElementById('q-reveal').style.display = 'none';
  currentIdx = null;
  updateStats();
  drawQuestion();
}

function resetPool() {
  if (!confirm('确定重置全部练习记录？')) return;
  pool = Array.from({length: 110}, (_, i) => i);
  drawn = [];
  currentIdx = null;
  document.getElementById('lottery-ring').className = 'lottery-ring';
  document.getElementById('lottery-num').textContent = '?';
  document.getElementById('q-reveal').style.display = 'none';
  updateStats();
  renderStats();
}

function updateStats() {
  document.getElementById('s-remain').textContent = pool.length;
  document.getElementById('s-drawn').textContent = drawn.length;
  document.getElementById('s-current').textContent = currentIdx !== null ? currentIdx + 1 : '—';
  document.getElementById('nav-progress').innerHTML = '剩余 <strong>' + pool.length + '</strong> 题';
}

// ── Browse logic ──
function buildBrowseList() {
  const list = document.getElementById('qa-list');
  list.innerHTML = '';
  QA.forEach((qa, i) => {
    const item = document.createElement('div');
    item.className = 'qa-item';
    item.dataset.idx = i;
    item.innerHTML = `
      <div class="qa-q" onclick="toggleItem(this.parentElement)">
        <span class="qa-num">${i+1}</span>
        <span class="qa-q-text">${qa[0]}</span>
        <svg class="qa-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="qa-a">${qa[1]}</div>
    `;
    list.appendChild(item);
  });
}

function toggleItem(el) {
  el.classList.toggle('open');
}

function filterList() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const items = document.querySelectorAll('.qa-item');
  let shown = 0;
  items.forEach(item => {
    const idx = parseInt(item.dataset.idx);
    const text = (QA[idx][0] + QA[idx][1]).toLowerCase();
    const match = !q || text.includes(q);
    item.style.display = match ? '' : 'none';
    if (match) {
      shown++;
      const qText = item.querySelector('.qa-q-text');
      const aText = item.querySelector('.qa-a');
      if (q) {
        const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(esc, 'gi');
        qText.innerHTML = QA[idx][0].replace(re, m => `<span class="highlight">${m}</span>`);
        aText.innerHTML = QA[idx][1].replace(re, m => `<span class="highlight">${m}</span>`);
      } else {
        qText.textContent = QA[idx][0];
        aText.textContent = QA[idx][1];
      }
    }
  });
  document.getElementById('result-count').textContent = q ? `找到 ${shown} 题` : '共 110 题';
}

// ── Stats ──
function renderStats() {
  document.getElementById('bs-total').textContent = drawn.length;
  document.getElementById('bs-remain').textContent = pool.length;
  document.getElementById('bs-drawn').textContent = drawn.length;
  document.getElementById('bs-pct').textContent = Math.round(drawn.length) + '%';

  const chips = document.getElementById('history-chips');
  if (drawn.length === 0) {
    chips.innerHTML = '<div class="empty-state"><div class="big">○</div>尚未开始练习</div>';
  } else {
    const sorted = [...drawn].sort((a,b) => a-b);
    chips.innerHTML = sorted.map(i => `<span class="h-chip">${i+1}</span>`).join('');
  }
}

// ── View switching ──
function switchView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'stats') renderStats();
}

// ── Init ──
buildBrowseList();
updateStats();
</script>
